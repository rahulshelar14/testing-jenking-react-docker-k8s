apiVersion: apps/v1

kind: Deployment

metadata:
  name: reactapp

spec:
  replicas: 5

  selector:
    matchLabels:
      app: reactapp

  template:
    metadata:
      labels:
        app: reactapp

    spec:
      containers:
        - name: reactapp

          image: shelarrahul1415/react-app-development:DEVELOPMENT

          ports:
            - containerPort: 3000
