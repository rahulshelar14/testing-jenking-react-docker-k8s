apiVersion: apps/v1

kind: Deployment

metadata:
  name: react-app-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: react-app

  template:
    metadata:
      labels:
        app: react-app

    spec:
      containers:
        - name: react-app

          image: shelarrahul1415/react-app-development:v1

          imagePullPolicy: Always

          ports:
            - containerPort: 3000
